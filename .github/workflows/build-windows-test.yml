name: Build .exe to test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Installer version override (e.g., 1.5.4)"
        required: false

permissions:
  contents: read

jobs:
  build-windows-test:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set version
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and "${{ github.event.inputs.version }}" -ne '') {
            $version = "${{ github.event.inputs.version }}"
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          # build.yml strips a leading "v" here; without it this workflow stamped
          # "v1.2.3" straight into PRODUCT_VERSION and the registry.
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Using VERSION=$version"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NSIS
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
            Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NSIS"
          }
          # Verify makensis is accessible
          $nsisPath = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsisPath) {
            Write-Warning "makensis not found on PATH, trying explicit lookup"
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($found) {
              Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $found -Parent)
              Write-Host "Added NSIS path: $(Split-Path $found -Parent)"
            } else {
              Write-Error "NSIS installation failed - makensis.exe not found"
            }
          } else {
            Write-Host "makensis found at: $nsisPath"
          }

      - name: Install dependencies
        run: npm install --include=optional

      - name: Prepare clangd bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run prebuild:clangd

      - name: Verify node-pty windows binary
        shell: powershell
        run: |
          @'
          const fs = require("fs");
          const path = require("path");
          const pkg = path.dirname(require.resolve("node-pty/package.json"));
          const platformDir = `win32-${process.arch}`;
          const candidates = [
            path.join(pkg, "prebuilds", platformDir, "pty.node"),
            path.join(pkg, "build", "Release", "pty.node"),
            path.join(pkg, "build", "Debug", "pty.node")
          ];
          console.log("node-pty path:", pkg);
          console.log("check candidates:", candidates);
          if (!fs.existsSync(path.join(pkg, "lib", "index.js"))) {
            throw new Error("node-pty lib/index.js missing; terminal will be unavailable in Windows package.");
          }
          if (!candidates.some((file) => fs.existsSync(file))) {
            throw new Error("node-pty windows native binary missing; terminal will be unavailable in Windows package.");
          }
          '@ | node

      - name: Build Windows app for NSIS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run prebuild:buildinfo
          npm run prebuild:icons
          npx electron-builder --win dir

      - name: Verify packaged language files
        shell: powershell
        run: |
          @'
          const fs = require("fs");
          const path = require("path");
          const asar = require("@electron/asar");
          const archive = path.join(process.cwd(), "dist", "win-unpacked", "resources", "app.asar");
          const languageFiles = ["src\\lang\\index.js", "src\\lang\\en.json", "src\\lang\\zh-cn.json"];
          if (!fs.existsSync(archive)) throw new Error(`Missing packaged app archive: ${archive}`);
          for (const file of languageFiles) {
            const content = asar.extractFile(archive, file).toString("utf8");
            if (!content) throw new Error(`Packaged language file is empty: ${file}`);
            if (file.endsWith(".json")) JSON.parse(content);
            console.log(`Verified packaged language file: ${file}`);
          }
          '@ | node

      - name: Verify packaged node-pty in app.asar.unpacked
        shell: powershell
        run: |
          @'
          const fs = require("fs");
          const path = require("path");
          const root = path.join(process.cwd(), "dist", "win-unpacked", "resources", "app.asar.unpacked", "node_modules", "node-pty");
          const platformDir = `win32-${process.arch}`;
          const indexFile = path.join(root, "lib", "index.js");
          const nativeCandidates = [
            path.join(root, "prebuilds", platformDir, "pty.node"),
            path.join(root, "build", "Release", "pty.node"),
            path.join(root, "build", "Debug", "pty.node")
          ];
          const sidecarCandidates = [
            path.join(root, "prebuilds", platformDir, "winpty-agent.exe"),
            path.join(root, "prebuilds", platformDir, "conpty", "OpenConsole.exe")
          ];
          console.log("packaged node-pty root:", root);
          if (!fs.existsSync(indexFile)) {
            throw new Error("packaged node-pty lib/index.js missing in app.asar.unpacked. Ensure asarUnpack includes node_modules/node-pty/**/*.");
          }
          if (!nativeCandidates.some((file) => fs.existsSync(file))) {
            throw new Error("packaged node-pty native binary missing in app.asar.unpacked.");
          }
          if (!sidecarCandidates.some((file) => fs.existsSync(file))) {
            throw new Error("packaged node-pty runtime sidecar missing in app.asar.unpacked.");
          }
          '@ | node

      - name: Prepare and Build Installer
        shell: powershell
        run: |
          $version = $env:VERSION
          Write-Host "Building version: $version"
          $nsiPath = "installer.nsi"

          # installer.nsi is UTF-8 *with* a BOM; NSIS keys UTF-8 detection off
          # that BOM. Read and write it explicitly so the Chinese literals are
          # never routed through the runner's ANSI codepage.
          $content = Get-Content $nsiPath -Raw -Encoding UTF8
          if (-not $content) { Write-Error "Failed to read $nsiPath"; exit 1 }

          # Assert that the pattern is present, then that the value landed.
          # Comparing before/after strings is wrong: when the file already holds
          # the target version the replacement is legitimately a no-op, and a
          # string comparison reports that as "not rewritten".
          $versionPattern = '!define PRODUCT_VERSION "[^"]*"'
          if (-not ($content -match $versionPattern)) {
              Write-Error "Could not find PRODUCT_VERSION in $nsiPath"; exit 1
          }
          $content = $content -replace $versionPattern, "!define PRODUCT_VERSION ""$version"""
          if (-not ($content -match ('!define PRODUCT_VERSION "' + [regex]::Escape($version) + '"'))) {
              Write-Error "PRODUCT_VERSION was not set to $version in $nsiPath"; exit 1
          }

          $outFilePattern = 'OutFile "OICPP-[^"]*-Setup\.exe"'
          if (-not ($content -match $outFilePattern)) {
              Write-Error "Could not find the OutFile line in $nsiPath"; exit 1
          }
          $content = $content -replace $outFilePattern, "OutFile ""OICPP-$version-Setup.exe"""
          if (-not ($content -match ('OutFile "OICPP-' + [regex]::Escape($version) + '-Setup\.exe"'))) {
              Write-Error "OutFile was not set for $version in $nsiPath"; exit 1
          }

          # UTF8Encoding($true) emits the BOM; Set-Content -Encoding UTF8 means
          # "with BOM" on PowerShell 5.1 but "without BOM" on PowerShell 7.
          [System.IO.File]::WriteAllText($nsiPath, $content, (New-Object System.Text.UTF8Encoding $true))

          $bytes = [System.IO.File]::ReadAllBytes($nsiPath)
          if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) {
            Write-Error "$nsiPath lost its UTF-8 BOM; makensis would read it as ANSI"
            exit 1
          }

          Copy-Item "ConsolePauser.exe" -Destination "dist\win-unpacked\" -Force
          Copy-Item "oicpp.ico" -Destination "dist\win-unpacked\" -Force

          makensis installer.nsi

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-artifacts
          path: OICPP-*-Setup.exe
          if-no-files-found: error
